[package]
name = "dot-rs"
version = "0.2.0"
edition = "2024"
rust-version = "1.100.0"

[dependencies]
anyhow = "1.0.105"
chrono = "0.4.45"
clap = { version = "4.6.9", features = ["derive"] }
dirs = "7.0.0"
env_logger = "0.11.12"
log = "0.4.35"
pathdiff = "0.2.3"
regex = "1.13.2"
saphyr = "0.4.0"

[dev-dependencies]
ctor = "1.0.14"
tempfile = "3.27.0"
test-log = "0.2.21"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
