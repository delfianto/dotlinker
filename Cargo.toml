[package]
name = "dot-rs"
version = "0.1.0"
edition = "2024"
rust-version = "1.98.0"

[dependencies]
anyhow = "1.0.104"
chrono = "0.4.45"
clap = { version = "4.6.6", features = ["derive"] }
dirs = "6.0.0"
env_logger = "0.11.11"
log = "0.4.34"
pathdiff = "0.2.3"
regex = "1.13.1"
saphyr = "0.0.12"
serde = { version = "1.0", features = ["derive"] }

[dev-dependencies]
ctor = "1.0.13"
tempfile = "3.27.0"
test-log = "0.2.21"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
