[package]
name = "dot-rs"
version = "0.1.0"
edition = "2024"

[dependencies]
# YAML parsing
saphyr = "0.0.6"
serde = { version = "1.0", features = ["derive"] }

# CLI argument parsing
clap = { version = "4.6.2", features = ["derive"] }

# Error handling
anyhow = "1.0.103"

# Logging
env_logger = "0.11.11"
log = "0.4.33"

# Path utilities
dirs = "6.0.0"
pathdiff = "0.2.3"

# Date/time for backups
chrono = "0.4.45"

# Regular expressions
regex = "1.13.1"

[dev-dependencies]
ctor = "0.6.3"
tempfile = "3.27.0"
test-log = "0.2.21"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
